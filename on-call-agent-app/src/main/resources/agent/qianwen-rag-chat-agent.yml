# 千问兼容版 RAG 智能问答智能体配置
# 使用阿里云 DashScope OpenAI 兼容接口，可无缝切换模型提供商
ai:
  agent:
    config:
      tables:
        qianwenRagChatAgent:
          app-name: qianwenRagChatAgent
          agent:
            agent-id: "200003"
            agent-name: 千问 RAG 问答
            agent-desc: 基于阿里云千问模型的文档知识库问答助手
          module:
            ai-api:
              # 阿里云 DashScope OpenAI 兼容接口
              base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
              api-key: ${DASHSCOPE_API_KEY:sk-xxx}
              completions-path: v1/chat/completions
              embeddings-path: v1/embeddings
            chat-model:
              model: qwen-plus
              tool-mcp-list:
                - local:
                    name: ragToolCallbackProvider
            agents:
              - name: qianwenRagChatAgent
                react-mode: true
                description: 千问版 RAG 智能问答助手
                instruction: |
                  你是一个专业的智能问答助手，可以基于内部知识库文档回答问题。
                  当用户提问时，使用 searchInternalDocs 工具检索相关文档，
                  然后基于检索到的内容回答用户的问题。
                  回答要求：
                  1. 基于检索到的文档内容准确回答
                  2. 注明信息来源（引用文档名或章节）
                  3. 如果检索结果不足以回答问题，诚实告知用户
                  4. 回答使用中文
                output-key: rag_answer
            runner:
              agent-name: qianwenRagChatAgent
              plugin-name-list:
                - myLogPlugin
