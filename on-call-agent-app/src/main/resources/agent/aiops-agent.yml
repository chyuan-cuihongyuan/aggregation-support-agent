# AIOps 智能运维智能体配置 — 多智能体协作的告警分析系统
# 使用 Planner-Executor 串行工作流：先规划分析步骤，再执行并生成报告
ai:
  agent:
    config:
      tables:
        aiopsAgent:
          app-name: aiopsAgent
          agent:
            agent-id: "200002"
            agent-name: AIOps 智能运维
            agent-desc: 多智能体协作的智能运维分析助手，自动分析告警并生成运维报告
          module:
            ai-api:
              base-url: ${LLM_BASE_URL:https://open.bigmodel.cn/api/coding/paas/v4}
              api-key: ${LLM_API_KEY:47b14566882e4e5ab68ae079e307667f.gYg6trXMmDAFQBT3}
              completions-path: /chat/completions
              embeddings-path: /embeddings
            chat-model:
              model: ${LLM_MODEL:glm-5.1}
              tool-mcp-list:
                # AIOps 分析工具集：时间、文档检索、告警查询、日志查询
                - local:
                    name: aiopsToolCallbackProvider
            agents:
              # 分析规划器 — 分解问题、调用工具收集信息、制定分析计划
              - name: aiops_planner
                description: AIOps 分析规划器，负责分解问题和制定分析计划
                instruction: |
                  你是一个运维分析规划器。根据用户的告警描述，制定详细的分析计划。
                  你可以使用以下工具收集信息：
                  1. getCurrentDateTime - 获取当前时间
                  2. queryPrometheusAlerts - 查询 Prometheus 活动告警
                  3. getAvailableLogTopics - 获取可用的日志主题
                  4. queryLogs - 查询特定日志
                  5. searchInternalDocs - 从知识库检索运维手册
                  请按以下步骤分析：
                  1. 获取当前时间，确认告警时间窗口
                  2. 查询 Prometheus 获取所有活动告警
                  3. 根据告警类型查询相关日志
                  4. 检索运维手册获取处理方案
                  5. 将所有信息整理为结构化的分析计划
                output-key: plan_result
              # 分析执行器 — 根据计划生成结构化的 Markdown 运维报告
              - name: aiops_executor
                description: AIOps 分析执行器，根据规划结果生成运维报告
                instruction: |
                  你是一个运维分析报告生成器。根据规划器提供的分析结果 {plan_result}，
                  生成一份完整的 Markdown 格式运维报告。
                  报告格式要求：
                  # 告警分析报告
                  ## 活跃告警清单
                  （表格：告警名称、级别、目标服务、首次触发时间、状态）
                  ## 告警根因分析
                  （每个告警：详情、症状描述、日志证据、根因结论）
                  ## 处理方案
                  （每个告警：已执行排查步骤、处理建议、预期效果）
                  ## 结论
                  （整体评估、关键发现、后续建议、风险评估）
                output-key: execution_result
            # 串行工作流：先规划后执行
            agent-workflows:
              - type: sequential
                name: aiops_pipeline
                description: AIOps 分析流水线，先规划分析步骤再执行生成报告
                sub-agents:
                  - aiops_planner
                  - aiops_executor
            runner:
              agent-name: aiops_pipeline
              plugin-name-list:
                - myLogPlugin
