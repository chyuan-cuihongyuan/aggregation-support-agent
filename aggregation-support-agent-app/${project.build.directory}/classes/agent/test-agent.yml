# 代码生成测试智能体配置 — Plan-Execute-Reflect Agentic Workflow
# 工作流：Loop(CodeReviewer, exitOrAcceptReview) → Sequential(CodeWriter, review_reflexion, CodeRefactorer)
# 在原有 Write→Review→Refactor 基础上增加 Reflexion 循环，支持代码质量评估和迭代改进
ai:
  agent:
    config:
      tables:
        testAgent01:
          app-name: testAgent01
          agent:
            agent-id: 100001
            agent-name: 测试智能体01
            agent-desc: 基于统一 Agentic Workflow 的代码生成-审查-重构测试智能体
          module:
            ai-api:
              base-url: https://apis.itedus.cn
              api-key: sk-REDACTED
              completions-path: v1/chat/completions
              embeddings-path: v1/embeddings
            chat-model:
              model: gpt-4.1
              max-tokens: 8192
              tool-mcp-list:
                - sse:
                    name: baidu-search
                    base-uri: http://appbuilder.baidu.com/v2/ai_search/mcp/
                    sse-endpoint: sse?api_key=bce-v3/ALTAK-3zODLb9qHozIftQlGwez5/2696e92781f5bf1ba1870e2958f239fd6dc822a4
                    request-timeout: 5000
                - sse:
                    name: baidu-map
                    base-uri: https://mcp.map.baidu.com/
                    sse-endpoint: sse?ak=tV0NsP4Gmj8IL7mhvyjVZ7c6
                    request-timeout: 5000
            agents:
              # ===== Step 1+2: Plan+Execute — 编写初始代码（合并阶段） =====
              - name: CodeWriterAgent
                react-mode: true
                max-steps: 10
                description: 根据用户需求编写初始 Java 代码
                instruction: |
                  You are a Java Code Generator.
                  Based *only* on the user's request, write Java code that fulfills the requirement.
                  Output *only* the complete Java code block, enclosed in triple backticks (```java ... ```).
                output-key: generated_code
              # ===== Step 3a: Reflect — 代码质量评估 =====
              - name: CodeReviewerAgent
                react-mode: false
                max-steps: 1
                description: 评审代码质量，输出结构化评估结果
                instruction: |
                  你是代码质量评估专家。评审以下 Java 代码：

                  ```java
                  {generated_code}
                  ```

                  评估标准：
                  1. **正确性**：逻辑是否正确？是否有 bug？
                  2. **可读性**：代码是否清晰？是否符合 Java 编码规范？
                  3. **效率**：是否有明显的性能问题？
                  4. **边界处理**：是否处理了边界情况和异常输入？
                  5. **最佳实践**：是否遵循 Java 最佳实践？

                  输出 JSON：
                  - 代码质量充足：{"verdict":"SUFFICIENT","summary":"评估摘要"}
                  - 代码需要改进：{"verdict":"INSUFFICIENT","issues":["问题1","问题2"],"suggestions":["建议1","建议2"]}

                  只输出 JSON，不要解释。
                output-key: review_verdict
              # ===== Step 3b: Replan — 退出或继续改进 =====
              - name: exitOrAcceptReview
                react-mode: false
                max-steps: 1
                exit-loop-enabled: true
                description: 根据代码评估决定退出循环或继续改进
                instruction: |
                  根据 {review_verdict}：
                  SUFFICIENT → 调用 exitLoop 工具退出循环，代码质量已达标。
                  INSUFFICIENT → 输出改进方向：{"action":"refactor","focus":["需要改进的关键点1","关键点2"]}

                  SUFFICIENT 时必须调用 exitLoop 工具，不要输出文本。INSUFFICIENT 时只输出 JSON。
                output-key: review_action
              # ===== Step 4: Respond — 基于审查结果重构代码 =====
              - name: CodeRefactorerAgent
                react-mode: true
                max-steps: 10
                description: 根据审查意见重构代码
                instruction: |
                  You are a Java Code Refactoring AI.
                  Your goal is to improve the given Java code based on the provided review comments.

                  **Original Code:**
                  ```java
                  {generated_code}
                  ```

                  **Review Comments:**
                  {review_verdict}

                  **Task:**
                  Carefully apply the suggestions from the review comments to refactor the original code.
                  If the review comments state "No major issues found," return the original code unchanged.
                  Ensure the final code is complete, functional, and includes necessary imports and docstrings.

                  **Output:**
                  Output *only* the final, refactored Java code block, enclosed in triple backticks (```java ... ```).
                  Do not add any other text before or after the code block.
                output-key: refactored_code
            # 工作流（展平结构：先定义内部 Loop，再定义外部 Sequential 引用它）
            agent-workflows:
              # 1. 先装配 Reflexion Loop（代码审查循环）
              - type: loop
                name: review_reflexion
                max-iterations: 2
                sub-agents:
                  - CodeReviewerAgent
                  - exitOrAcceptReview
              # 2. 再装配主流程 Sequential（引用已装配的 review_reflexion）
              - type: sequential
                name: CodePipelineAgent
                description: 编写代码 → Reflexion 质量评估 → 重构代码
                sub-agents:
                  - CodeWriterAgent
                  - review_reflexion
                  - CodeRefactorerAgent
            runner:
              agent-name: CodePipelineAgent