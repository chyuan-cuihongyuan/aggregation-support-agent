# AIOps 智能运维智能体配置 — Plan-Execute-Reflect 工作流
# 工作流：Loop(reportCritic, exitOrRefine) → Sequential(aiops_planner, aiops_executor, report_reflexion)
ai:
  agent:
    config:
      tables:
        aiopsAgent:
          app-name: aiopsAgent
          agent:
            agent-id: "200002"
            agent-name: AIOps 智能运维
            agent-desc: 基于 Plan-Execute-Reflect 工作流的多智能体协作运维分析助手
          module:
            ai-api:
              base-url: ${LLM_BASE_URL:https://open.bigmodel.cn/api/paas/v4}
              api-key: ${LLM_API_KEY:47b14566882e4e5ab68ae079e307667f.gYg6trXMmDAFQBT3}
              completions-path: /chat/completions
              embeddings-path: /embeddings
            chat-model:
              model: ${LLM_MODEL:glm-4-flash}
              max-tokens: 16384
              tool-mcp-list:
                - local:
                    name: aiopsToolCallbackProvider
            agents:
              # ===== Plan: 分析规划器 =====
              - name: aiops_planner
                react-mode: true
                max-steps: 15
                description: AIOps 分析规划器，负责分解问题和制定分析计划
                instruction: |
                  你是一个运维分析规划器。根据用户的告警描述，制定详细的分析计划。
                  你可以使用以下工具收集信息：
                  1. getCurrentDateTime - 获取当前时间
                  2. queryPrometheusAlerts - 查询 Prometheus 活动告警
                  3. getAvailableLogTopics - 获取可用的日志主题
                  4. queryLogs - 查询特定日志
                  5. queryInternalDocs - 从知识库检索运维手册
                  请按以下步骤分析：
                  1. 获取当前时间，确认告警时间窗口
                  2. 查询 Prometheus 获取所有活动告警
                  3. 根据告警类型查询相关日志
                  4. 检索运维手册获取处理方案
                  5. 将所有信息整理为结构化的分析计划
                output-key: plan_result
              # ===== Execute: 分析执行器 =====
              - name: aiops_executor
                react-mode: true
                max-steps: 10
                description: AIOps 分析执行器，根据规划结果生成运维报告
                instruction: |
                  你是一个运维分析报告生成器。根据规划器提供的分析结果 {plan_result}，
                  生成一份完整的 Markdown 格式运维报告。
                  报告格式要求：
                  # 告警分析报告
                  ## 活跃告警清单
                  （表格：告警名称、级别、目标服务、首次触发时间、状态）
                  ## 告警根因分析
                  （每个告警：详情、症状描述、日志证据、根因结论）
                  ## 处理方案
                  （每个告警：已执行排查步骤、处理建议、预期效果）
                  ## 结论
                  （整体评估、关键发现、后续建议、风险评估）
                  【重要规则】生成报告后立即停止，不要重复生成或追加多余的分析
                output-key: execution_result
              # ===== Reflect: 报告质量评估器 =====
              - name: reportCritic
                react-mode: false
                max-steps: 1
                description: 评估运维报告的完整性和可操作性
                instruction: |
                  评估运维报告 {execution_result} 的质量：
                  1. 是否包含完整的告警清单？
                  2. 根因分析是否有日志证据支撑？
                  3. 处理方案是否具体可操作？
                  4. 结论是否包含后续建议和风险评估？
                  输出 JSON：{"verdict":"SUFFICIENT","summary":"评估摘要"} 或
                  {"verdict":"INSUFFICIENT","gaps":["缺少告警清单","根因分析无证据支撑"]}
                  只输出 JSON。
                output-key: quality_verdict
              # ===== Replan: 退出或补充分析 =====
              - name: exitOrRefine
                react-mode: false
                max-steps: 1
                exit-loop-enabled: true
                description: 根据质量评估决定退出循环或补充分析
                instruction: |
                  根据 {quality_verdict}：
                  SUFFICIENT → 调用 exitLoop 工具退出循环
                  INSUFFICIENT → 输出补充方向：{"action":"supplement","directions":["需要补充日志证据"]}
                  SUFFICIENT 时必须调用 exitLoop 工具，不要输出文本。INSUFFICIENT 时只输出 JSON。
                output-key: refine_action
              # ===== Supplement: 执行补充分析 =====
              - name: supplementAnalyzer
                react-mode: true
                max-steps: 5
                description: 根据补充方向执行额外分析并更新报告
                instruction: |
                  根据补充方向 {refine_action} 调用 AIOps 工具（queryLogs、queryInternalDocs）收集缺失信息。
                  将补充分析合并到 {execution_result}，更新运维报告。
                  输出完整的、更新后的报告，覆盖 execution_result。
                output-key: execution_result
            # 工作流（展平结构）
            agent-workflows:
              # 1. 先装配 Reflexion Loop（内部循环：评估 → 决策 → 补充）
              - type: loop
                name: report_reflexion
                max-iterations: 2
                sub-agents:
                  - reportCritic
                  - exitOrRefine
                  - supplementAnalyzer
              # 2. 再装配主流程 Sequential
              - type: sequential
                name: aiops_pipeline
                sub-agents:
                  - aiops_planner
                  - aiops_executor
                  - report_reflexion
            runner:
              agent-name: aiops_pipeline
              plugin-name-list:
                - myLogPlugin
